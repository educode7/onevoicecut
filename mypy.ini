[mypy]
files = src, tests
python_version = 3.12
strict = True
disallow_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
namespace_packages = True
explicit_package_bases = True
mypy_path = src

# faster-whisper ships no py.typed marker and no stubs are published for it, so
# strict mode cannot see through the import. Scoped to this one module rather
# than relaxed globally: the untyped surface stops at the adapter that wraps it,
# which is the same boundary that already stops provider exceptions.
[mypy-faster_whisper.*]
ignore_missing_imports = True
