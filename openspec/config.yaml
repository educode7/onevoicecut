schema: spec-driven

context: |
  Tech stack: Python 3.12, venv + pip (split requirements files + frozen lock), FastAPI/Uvicorn,
    pydantic. ffmpeg is a SYSTEM binary, never a pip dependency.
  Architecture: hexagonal. src/transcribe/{domain,ports,usecases} is the core (domain has zero
    third-party imports); adapters/ and runtime/ are planned but DO NOT EXIST YET. runtime/ is the
    composition root — the only place adapters may be constructed. The boundary is enforced by
    tests/test_architecture.py, an ast walker that fails if the core imports adapters/runtime.
    Pipeline: upload video/audio -> ffmpeg extract + chunk -> transcribe (local or cloud ASR,
    selected per job) -> stitch -> structured Transcript -> .txt export + LLM summary, timestamped
    clip candidates and N script variants for short-form social/ad video.
  Domain constraints: source audio is SPANISH ONLY; source videos are ALWAYS MULTI-HOUR (this drives
    chunking, chunk-level progress/failure/resume, per-chunk timeouts); source audio routinely
    contains MUSIC AND SINGING alongside the speaker, so segments carry a SegmentKind
    (speech/music/uncertain) and the message export/LLM input are speech-only. Interview mode
    (multiple speakers) is opt-in per job via SpeakerMode.
  Testing: pytest with --strict-markers; markers integration/localmodel/paid. The default run
    excludes `paid` and `localmodel`, so it never invokes a billed API or loads real model weights.
    mypy strict over src and tests. Strict TDD: every change is RED before GREEN.
  Style: frozen slotted dataclasses in domain; typing.Protocol for ports (not ABCs); domain errors in
    domain/errors.py raised across port boundaries — adapters never leak provider exceptions upward.
    No silent degradation: an adapter that cannot diarize refuses, and one that cannot classify
    non-speech reports `uncertain`, never `speech`.
  Repo: git repository, default branch `main` (initialized 2026-08-17). Slice 1 (bootstrap + walking
    skeleton) is committed and green on branch `slice-1-bootstrap-walking-skeleton`. .gitignore
    excludes uploaded media, local ASR model weights, and .env.

rules:
  proposal:
    - Include rollback plan for risky changes
    - First change must select and record a Python dependency manager (uv/poetry/pipenv/venv+pip) per managing-python-dependencies skill before any pip install
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Respect the 400-line review budget (delivery_strategy: ask-on-risk)
  apply:
    guidelines:
      - Follow existing code patterns once established
      - Default to venv + pip unless project later adopts uv/poetry/pipenv (see managing-python-dependencies skill)
    tdd: true            # Strict TDD Mode enabled globally for this user
    test_command: '.venv\Scripts\python.exe -m pytest -m "not paid and not localmodel"'
  verify:
    test_command: '.venv\Scripts\python.exe -m pytest -m "not paid and not localmodel"'
    build_command: '.venv\Scripts\python.exe -m mypy src tests'
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

review:
  budget_lines: 400
  delivery_strategy: auto-chain
  chain_strategy: stacked-to-main
  # Slice 1 shipped under an accepted size:exception (1273 lines vs main).
  # Cause: slice estimates omitted the strict-TDD test multiplier.
  # Empirical ratio from slice 1 — tests 714 / src 461 / config 98.

execution_mode: interactive
artifact_store: hybrid
strict_tdd: true
