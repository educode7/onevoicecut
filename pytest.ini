[pytest]
addopts = --strict-markers
testpaths = tests
pythonpath = src
# The web adapter is the only async surface in the system, and its routes are
# driven through an in-process ASGI transport. `auto` keeps those tests free of
# a decorator that would otherwise appear on every one of them.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: real filesystem or ffmpeg subprocess, free and fast; skipped when ffmpeg is absent
    localmodel: loads real ASR/diarization model weights; excluded from the default suite
    paid: invokes a billed cloud API; excluded from the default suite
